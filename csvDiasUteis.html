<script>
    let ano = 2026;

    //mes comeca em 0
    //https://www.anbima.com.br/feriados/fer_nacionais/2025.asp
    //https://www.anbima.com.br/feriados/feriados.asp
    //https://www.b3.com.br/pt_br/noticias/calendario-de-feriados-2025.htm
	//tem feriados fixos e moveis.
    var feriados =
        [
            new Date(ano, 1 - 1, 1),//Confraternização Universal
			//carnaval
			//Paixão de Cristo
            new Date(ano, 4 - 1, 21),//Tiradentes
            new Date(ano, 5 - 1, 1),//Dia do Trabalho
			//Corpus Christi
            new Date(ano, 9 - 1, 7),//Independência do Brasil
            new Date(ano, 10 - 1, 12),//Nossa Sr.a Aparecida - Padroeira do Brasil
            new Date(ano, 11 - 1, 2),//Finados
            new Date(ano, 11 - 1, 15),//Proclamação da República
            new Date(ano, 11 - 1, 20),//Dia Nacional de Zumbi e da Consciência Negra
            new Date(ano, 12 - 1, 24),//Véspera de Natal
            new Date(ano, 12 - 1, 25),//Natal
            new Date(ano, 12 - 1, 31),//Véspera de Ano Novo
            new Date(ano + 1, 1 - 1, 1),//Confraternização Universal
        ];
	var feriadosMoveis =
        [
            new Date(ano, 2 - 1, 16),//Carnaval, fev/mar
            new Date(ano, 2 - 1, 17),//Carnaval
			new Date(ano, 4 - 1, 3),//Paixão de Cristo, mar/abril
            new Date(ano, 6 - 1, 4),//Corpus Christi, maio/junho
        ];

    function downloadCSV(csvContent) {
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);

        // Open directly in a new tab (triggers download in most browsers)
        window.open(url);

        // Optional: clean up after a short delay
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function process() {
        let csvContent = "";

        var date = new Date(ano, 1 - 1, 1);
        for (let i = 1; i < 367; i++) {
            if (!feriados.some(d => d.getTime() == date.getTime()) &&
			!feriadosMoveis.some(d => d.getTime() == date.getTime()) &&
			(date.getDay() != 0 && date.getDay() != 6))
                csvContent += date.toLocaleDateString('pt-br') + "\r\n";
            date.setDate(date.getDate() + 1);
        }

        downloadCSV(csvContent);
    }

    process();
</script>
